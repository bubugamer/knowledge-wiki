name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs mkdocs-material mkdocs-roamlinks-plugin

      - name: Filter private pages
        run: python scripts/filter_private.py

      - run: mkdocs gh-deploy --force
